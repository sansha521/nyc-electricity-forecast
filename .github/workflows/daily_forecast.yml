name: Daily NYC Electricity Forecast

on:
  schedule:
    - cron: "30 22 * * *"

  workflow_dispatch:

jobs:
  forecast:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
      VISUAL_CROSSING_API_KEY: ${{ secrets.VISUAL_CROSSING_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily forecast
        run: |
          for attempt in 1 2 3 4; do
            python -m app.run_daily && exit 0
            echo "Daily forecast attempt ${attempt} failed; waiting 15 minutes before retry."
            sleep 900
          done
          python -m app.run_daily

      - name: Score recent predictions
        run: |
          python -m app.evaluate_predictions
