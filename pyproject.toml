[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nyc-electricity"
version = "0.1.0"
description = "Day-ahead forecasting of NYC electricity demand from weather and calendar features"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    # data wrangling
    "pandas>=3.0",
    "numpy>=2.5",
    "holidays>=0.101",       # US/NY holiday calendar features

    # data ingestion
    "requests>=2.34",
    "python-dotenv>=1.2",    # loads .env (EIA + Visual Crossing keys)
    "openmeteo-requests>=1.7",
    "requests-cache>=1.3",   # Open-Meteo client caching
    "retry-requests>=2.0",   # Open-Meteo client retries

    # models
    "scikit-learn>=1.9",
    "xgboost>=3.3",
    "lightgbm>=4.7",

    # database
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
# Only needed for visualize_data.ipynb: pip install -e ".[notebook]"
notebook = [
    "matplotlib>=3.11",
    "seaborn>=0.13",
    "ipykernel>=7.3",
]

# This repo is a collection of scripts, not an importable package.
# Declaring no packages keeps setuptools' auto-discovery from choking on the
# flat layout (data_loading/, fusion/, time_series/).
[tool.setuptools]
packages = []
